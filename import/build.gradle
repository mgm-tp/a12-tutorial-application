def importDirectory = file("${projectDir}")
def hasPackableContent = hasContent(importDirectory)

tasks.register('importsPackage', Zip) {
    group 'Publishing'
    description 'Packages importable resources of A12 Tutorial Application to zip.'
    dependsOn ':convertModels'

    from(rootProject.file('build/wcf-output/data/models')) { into 'models' }
    from(importDirectory) {
        exclude 'build', 'build.gradle', 'models'
    }
    archiveBaseName.set(getArtifactName())
    if (hasPackableContent) {
        doLast {
            println "Content of $importDirectory packed and converted models packed."
        }
    } else {
        println "No packable files in directory $importDirectory."
    }
}

if (hasPackableContent) {
    publishing {
        publications {
            importsZip(MavenPublication) {
                // groupId/version are intentionally left unset: the maven-publish convention
                // defaults them to project.group/project.version resolved lazily at publish
                // time, after initProject has set the real coordinates on all projects.
                // Setting them explicitly here would capture the gradle.properties placeholders.
                artifactId = getArtifactName()
                artifact source: importsPackage, extension: 'zip'
                pom {
                    name = 'A12 Tutorial Application Imports'
                    description = 'Packed resources to be imported to A12 Tutorial Application.'
                }
            }
        }
    }

    tasks.named('publish').configure {
        dependsOn 'importsPackage'
    }
}

boolean hasContent (File importDir) {
    def hasContent = importDir.listFiles().any { file ->
        file.name != 'build' && file.name != 'build.gradle'
    }
    if (!hasContent) {
        println "No packable files in directory $importDir."
    }
    return hasContent
}

String getArtifactName () {
    if (project.hasProperty("variant")) {
        return "a12-tutorial-application-imports-${project.getProperty("variant")}"
    } else {
        return "a12-tutorial-application-imports"
    }
}

tasks.named('cyclonedxBom').configure { enabled = false }
