roles:
  - name: admin
    description: admin role
    accessRights:
      - DOCUMENT_CREATE
      - DOCUMENT_UPDATE
      - DOCUMENT_PARTIAL_UPDATE
      - DOCUMENT_DELETE
      - ATTACHMENT_UPLOAD
      - MODEL_MANAGE
      - QUERY
      - TASK_ASSIGN
      - TASK_COMPLETE
      - SEND_MESSAGE
      - START_PROCESS
      - GET_PROCESS_VARIABLE_UPDATES
      - CREATE_METADATA
      - REMOVE_METADATA
  - name: systemAdmin
    description: system admin role
    accessRights:
      - ACCESS_ACTUATOR
      - MANAGE_CACHES
      - RELOAD_AUTH_RULES
  - name: user
    description: user role
    accessRights:
      - DOCUMENT_CREATE
      - DOCUMENT_UPDATE
      - DOCUMENT_PARTIAL_UPDATE
      - DOCUMENT_DELETE
      - MODEL_READ
      - ATTACHMENT_UPLOAD
      - QUERY
      - TASK_ASSIGN
      - TASK_COMPLETE
      - SEND_MESSAGE
      - START_PROCESS
