# Project configuration
group=com.mgmtp.your-project-name
version=2025.06
a12ReleaseVersion=2025.06
# TODO: Update to your project JIRA code
projectJiraCode=A12BD|A12PT

# Deployment
# TODO-Start: Replace these values with your docker-registry
dockerRegistryForPublish=your-project-name.dockerregistry.mgm-tp.com
dockerRegistryForRead=dockerregistry.mgm-tp.com
# TODO-End: Replace these values with your docker-registry

# CONFIG: Set 'false' if you do not use credentials
dockerUseCredentials=true
# CONFIG: Base image for Spring Boot Layer Index approach for building docker image.
dockerSeverBaseImage=eclipse-temurin:21-jre-jammy
dockerClientBaseImage=nginx:1.29.3-alpine-slim

# Service names for calculating Docker image tags
clientName=frontend
serverName=server
serverInitName=server-init

# Docker
#dockerHost=tcp://some-remote-host:2375

# Gradle configuration
org.gradle.parallel=true
org.gradle.caching=true
# CONFIG: Set 'true' if you want to enable the configuration cache for Gradle builds
# see https://docs.gradle.org/8.7/userguide/configuration_cache.html#config_cache:usage
org.gradle.configuration-cache=false

# Code quality
checkstyleVersion=10.15.0
skipLintFormat=false
skipCheckstyle=false
