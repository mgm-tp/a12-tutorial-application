<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Your-Project-Name</title>
    </head>

    <body>
        <div id="root" class="base">
            <div
                style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    height: 100%;
                    width: 100svw;
                    padding: 32px;
                    box-sizing: border-box;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background-color: #fff;
                    opacity: 0;
                    animation: fadeIn 0.2s ease 0.3s forwards;
                ">
                <style>
                    @keyframes fadeIn {
                        to {
                            opacity: 1;
                        }
                    }
                </style>
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 6332 286"
                    style="max-width: 720px"
                    aria-hidden="true">
                    <style>
                        rect {
                            transform-box: fill-box;
                            transform-origin: center;
                            opacity: 0;
                            transform: scale(0);
                            animation-name: cycle;
                            animation-duration: 4s;
                            animation-timing-function: linear;
                            animation-iteration-count: infinite;
                            animation-fill-mode: both;
                            animation-delay: calc(var(--n) * 200ms);
                        }

                        @keyframes cycle {
                            2.5% {
                                transform: scale(1.15);
                                opacity: 1;
                            }

                            5% {
                                transform: scale(1);
                                opacity: 1;
                            }

                            55% {
                                transform: scale(1);
                                opacity: 1;
                            }

                            60% {
                                transform: scale(0);
                                opacity: 0;
                            }
                        }
                    </style>
                    <rect x="79" y="68" width="718" height="149" fill="#36cefa" style="--n: 0" />
                    <rect x="859" y="68" width="718" height="149" fill="#207475" style="--n: 1" />
                    <rect x="1638" y="68" width="718" height="149" fill="#fc7340" style="--n: 2" />
                    <rect x="2417" y="68" width="718" height="149" fill="#a0012c" style="--n: 3" />
                    <rect x="3197" y="68" width="718" height="149" fill="#fad120" style="--n: 4" />
                    <rect x="3976" y="68" width="718" height="149" fill="#b562cd" style="--n: 5" />
                    <rect x="4755" y="68" width="718" height="149" fill="#1d4e86" style="--n: 6" />
                    <rect x="5535" y="68" width="718" height="149" fill="#b0e341" style="--n: 7" />
                </svg>
            </div>
        </div>
        <noscript>
            <div
                style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-sizing: border-box;
                    font-family: sans-serif;
                    font-size: 1.12rem;
                    color: #091645;
                    background-color: #fff;
                ">
                <div
                    style="
                        max-width: 720px;
                        border-radius: 4px;
                        border-width: 2px;
                        border-style: solid;
                        border-color: #cb104b;
                        background-color: #cb104b22;
                        padding: 0.5em 1.5em;
                        margin: 1em;
                    ">
                    <h1 style="font-size: 1.25rem; font-weight: 600">JavaScript is deactivated</h1>
                    <p>JavaScript is required to use this site. Please enable JavaScript in your browser.</p>
                </div>
            </div>
        </noscript>
    </body>
</html>
